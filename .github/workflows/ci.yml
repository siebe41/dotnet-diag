name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  GITLEAKS_VERSION: v8.30.1

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: a key committed and then deleted in a later commit is still leaked.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Built from the Go module proxy at a pinned version; the Go checksum database verifies the
      # source, so no third-party action or unverified binary download is involved.
      - name: Install gitleaks
        run: |
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Findings are redacted in the log. A confirmed false positive goes in .gitleaksignore by its
      # fingerprint (printed with each finding).
      - name: Scan git history for secrets
        run: gitleaks git --redact --verbose --no-banner .

  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      # NuGet advisories for direct and transitive packages. Directory.Build.props keeps NU1901-NU1904
      # as warnings so a new advisory does not break local builds; this is where it fails instead.
      # Advisories do not depend on the OS, so one leg is enough.
      - name: Check for vulnerable packages
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive
          vulnerable=$(dotnet list package --vulnerable --include-transitive --format json \
            | jq -r '[.projects[].frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | .id] | unique | join(", ")')
          if [ -n "$vulnerable" ]; then
            echo "::error::Vulnerable NuGet packages: $vulnerable"
            exit 1
          fi

      - name: Build
        run: dotnet build --no-restore -c Release -bl:artifacts/logs/build.binlog

      - name: Test
        shell: bash
        run: |
          dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results 2>&1 \
            | tee artifacts/logs/test-output.txt
          exit ${PIPESTATUS[0]}

      - name: Pack global tool
        run: dotnet pack src/DotnetDiag.Cli --no-build -c Release

      # Install the package exactly as a user would and run it through the OS's own shim (dotnet-diag.exe on Windows).
      - name: Smoke test installed tool
        shell: bash
        run: |
          set -u
          # --source, not --add-source: newer SDKs refuse --add-source next to the package source mapping in
          # nuget.config. The tool package carries its dependencies, so the local folder is the only feed needed.
          dotnet tool install DotnetDiag.Tool --tool-path .tools --source artifacts/nupkg
          export PATH="$PWD/.tools:$PATH"
          fixtures=tests/DotnetDiag.Tests/Fixtures
          expect() { case "$1" in *"$2"*) ;; *) echo "expected output to contain: $2"; echo "$1" | head -40; exit 1;; esac; }

          dotnet-diag --version
          expect "$(dotnet-diag explain NU1605)" "Package downgrade detected"

          # --exit-code gates CI: problems found => 1
          set +e
          out=$(dotnet-diag analyze "$fixtures/missing-package-cs0246.txt" --offline --format json --exit-code)
          code=$?
          set -e
          [ "$code" -eq 1 ] || { echo "expected exit code 1, got $code"; exit 1; }
          expect "$out" '"errorCount": 5'

          # Piped input, as in: dotnet test | dotnet-diag analyze
          expect "$(dotnet-diag analyze --offline --format markdown < "$fixtures/dotnet-test-vstest.txt")" "## Failing tests"

          # The binlog this very build produced must parse on this OS.
          expect "$(dotnet-diag analyze artifacts/logs/build.binlog --offline --format json)" '"kind": "binaryLog"'
          echo "smoke test passed"

      - name: Diagnose failure with dotnet-diag
        if: failure()
        shell: bash
        run: |
          log=artifacts/logs/test-output.txt
          [ -s "$log" ] || log=artifacts/logs/build.binlog
          dotnet run --project src/DotnetDiag.Cli -c Release -- analyze "$log" --format markdown >> "$GITHUB_STEP_SUMMARY" || true
          dotnet run --project src/DotnetDiag.Cli -c Release -- analyze "$log" || true

      - name: Upload package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: artifacts/nupkg/*.nupkg

      - name: Upload test results and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.os }}
          path: |
            artifacts/logs/
            artifacts/test-results/

  eval:
    name: Usefulness eval (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      # Breaks ~10 real projects on this OS, diagnoses them from binlogs and console output,
      # applies the tool's suggested fixes and rebuilds. Fails on any regression outside known gaps.
      - name: Run eval
        shell: bash
        run: |
          dotnet run --project eval/DotnetDiag.Eval -c Release -- --report "artifacts/eval/report-${{ matrix.os }}.md"

      - name: Publish report
        if: always()
        shell: bash
        run: |
          [ -f "artifacts/eval/report-${{ matrix.os }}.md" ] && cat "artifacts/eval/report-${{ matrix.os }}.md" >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-report-${{ matrix.os }}
          path: artifacts/eval/
