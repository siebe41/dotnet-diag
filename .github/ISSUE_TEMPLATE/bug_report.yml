name: Bug report
description: Something does not work as documented, crashes or gives an error.
labels: [ "bug", "needs-triage" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Search the open issues first in case it is already known. If the tool ran but pointed at the wrong cause, use **Missed the root cause** instead.

        **Do not paste API keys or tokens, and do not attach a binlog from a private build.** Binary logs record environment variables, and build output can contain source lines, internal paths and package feed URLs. Paste trimmed output, with anything private replaced by a placeholder such as `<key>`. Security problems go through the Security tab ("Report a vulnerability"), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The command line or the steps in the desktop app, and the smallest input that shows the problem.
      placeholder: |
        1. dotnet build -bl
        2. dotnet-diag analyze msbuild.binlog --offline
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `dotnet-diag --version`, or the commit you built from.
      placeholder: e.g. 0.1.0, or main at abc1234
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Global tool installed from source
        - Desktop app
        - dotnet run from a clone
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: input
    attributes:
      label: Input
      options:
        - Binary log (.binlog)
        - Text build log
        - dotnet test output
        - No log (explain or doctor)
        - Other
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: AI provider, if any
      description: "`none`/`--offline`, or the provider and model."
      placeholder: e.g. none, or ollama qwen2.5-coder:14b
  - type: textarea
    id: output
    attributes:
      label: Output and error messages
      description: What dotnet-diag printed, and any stack trace. Check it for keys, internal paths and source you cannot share before posting.
      render: text
