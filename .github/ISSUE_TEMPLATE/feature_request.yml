name: Feature request
description: Suggest a new capability or a change to existing behaviour.
labels: [ "enhancement", "needs-triage" ]
body:
  - type: markdown
    attributes:
      value: |
        Check the open issues first; the idea may already be under discussion. If dotnet-diag does not recognize an error code or gives the wrong advice for one, a **Missed the root cause** report is usually more useful.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen. Command-line or output sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Other ways you considered, or what you do now.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you work on it?
      options:
        - "No"
        - Yes, with some guidance
        - Yes, I can open a pull request
